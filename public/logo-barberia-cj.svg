<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c1a16" />
      <stop offset="60%" stop-color="#0c0b0a" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f" />
      <stop offset="35%" stop-color="#d6a331" />
      <stop offset="70%" stop-color="#fde08b" />
      <stop offset="100%" stop-color="#a67718" />
    </linearGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde08b" />
      <stop offset="50%" stop-color="#8f6312" />
      <stop offset="100%" stop-color="#f5d77f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background circular plaque -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#metalRing)" stroke-width="6" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(214, 163, 49, 0.45)" stroke-width="1.8" stroke-dasharray="4 4" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Stars decor -->
  <g fill="url(#goldGrad)">
    <polygon points="256,58 261,72 276,72 264,81 268,95 256,86 244,95 248,81 236,72 251,72" transform="scale(0.85) translate(45, 12)" />
    <polygon points="170,95 174,106 186,106 176,113 180,124 170,117 160,124 164,113 154,106 166,106" transform="scale(0.7) translate(72, 45)" />
    <polygon points="342,95 346,106 358,106 348,113 352,124 342,117 332,124 336,113 326,106 338,106" transform="scale(0.7) translate(146, 45)" />
  </g>

  <!-- Crossed Barber Scissors & Razor Emblem -->
  <g transform="translate(256, 175)" filter="url(#glow)">
    <!-- Scissor Blades -->
    <path d="M-45 -35 L45 35 M45 -35 L-45 35" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
    <!-- Scissor Rings -->
    <circle cx="-52" cy="-42" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
    <circle cx="52" cy="-42" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
    <!-- Center Pivot -->
    <circle cx="0" cy="0" r="5" fill="#fde08b" stroke="#7a520c" stroke-width="2" />
  </g>

  <!-- Monogram CJ -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="bold" text-anchor="middle" fill="url(#goldGrad)">
    <text x="256" y="278" font-size="78" letter-spacing="4">CJ</text>
  </g>

  <!-- Barber Ribbon/Banner Background -->
  <path d="M110 305 L402 305 L382 345 L130 345 Z" fill="#13110d" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- BARBERÍA Text -->
  <text x="256" y="333" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="9" fill="url(#goldGrad)" text-anchor="middle">
    BARBERÍA
  </text>

  <!-- Subtitle CONCEPCIÓN -->
  <text x="256" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#c8c2b6" text-anchor="middle">
    CONCEPCIÓN · CHILE
  </text>

  <!-- Classic Barber Pole Stripes Small Accent -->
  <g transform="translate(216, 404)">
    <rect x="0" y="0" width="80" height="7" rx="3.5" fill="#222" stroke="url(#goldGrad)" stroke-width="1.2" />
    <circle cx="15" cy="3.5" r="2.5" fill="#e53e3e" />
    <circle cx="40" cy="3.5" r="2.5" fill="#fde08b" />
    <circle cx="65" cy="3.5" r="2.5" fill="#3182ce" />
  </g>

  <!-- Outer Tagline / EST -->
  <text x="256" y="440" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="3" fill="#8d8474" text-anchor="middle">
    ESTILO &amp; TRADICIÓN
  </text>
</svg>
